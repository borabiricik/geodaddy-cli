[package]
name = "geodaddy"
version = "0.3.1"
edition = "2021"
license = "MIT"

[lib]
name = "geodaddy"
path = "src/lib.rs"

[[bin]]
name = "geodaddy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = { version = "2.5", features = ["serde"] }
robotstxt = "0.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
scraper = "0.26"
regex = "1.12"
jsonschema = "0.45"
quick-xml = { version = "0.39", features = ["serialize"] }
chromiumoxide = { version = "0.9", features = ["fetcher", "zip8", "rustls"] }
futures = "0.3"
colored = "2"

[dev-dependencies]
assert_cmd = "2"
mockito = "1"
