[package]
name = "geodaddy"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
name = "geodaddy"
path = "src/lib.rs"

[[bin]]
name = "geodaddy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", features = ["rustls", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = { version = "2.5", features = ["serde"] }
robotstxt = "0.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
scraper = "0.29"
ego-tree = "0.11"
regex = "1.12"
quick-xml = { version = "0.42", features = ["serialize"] }
chromiumoxide = "0.9"
futures = "0.3"
colored = "3"

[dev-dependencies]
assert_cmd = "2"
mockito = "1"
